name: Scheduled Tests

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  scheduled-test:
    name: Daily Test Run
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
        
    - name: Install XcodeGen
      run: |
        brew install xcodegen
        
    - name: Generate Xcode project
      run: |
        make generate
        
    - name: Debug Package Dependencies
      run: |
        echo "🔍 Checking package dependencies..."
        ls -la GitHubApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/
        echo "📦 Package.resolved content:"
        cat GitHubApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || echo "Package.resolved not found"
        
    - name: Clean Package Dependencies
      run: |
        make clean-packages
        
    - name: Generate Xcode project (after cleaning)
      run: |
        make generate
        
    - name: Run All Tests
      run: |
        make test
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: scheduled-test-results
        path: |
          /Users/runner/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          /Users/runner/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
        retention-days: 5 