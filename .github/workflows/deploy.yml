name: Deploy

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
        
    - name: Install XcodeGen
      run: |
        brew install xcodegen
        
    - name: Generate Xcode project
      run: |
        xcodegen generate
        
    - name: Build and Archive for Production
      run: |
        xcodebuild clean archive \
          -project GitHubApp.xcodeproj \
          -scheme GitHubAppProd \
          -configuration Release \
          -archivePath ./build/GitHubApp.xcarchive \
          -destination 'generic/platform=iOS' \
          | xcpretty
          
    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath ./build/GitHubApp.xcarchive \
          -exportPath ./build/ \
          -exportOptionsPlist ./scripts/exportOptions.plist
          
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        
    - name: Upload Release Assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./build/GitHubApp.ipa
        asset_name: GitHubApp.ipa
        asset_content_type: application/octet-stream
        
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: production-build
        path: |
          ./build/
          ./build/GitHubApp.xcarchive 