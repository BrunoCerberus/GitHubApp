name: CI Pipeline

on:
  pull_request:
    branches: [ develop, master, main ]
  push:
    branches: [ develop, master, main ]

jobs:
  code-quality:
    name: Code Quality
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.3'
        
    - name: Install XcodeGen
      run: |
        brew install xcodegen
        
    - name: Generate Xcode project
      run: |
        make generate
        
    - name: Install Mint
      run: |
        brew install mint
        
    - name: Install SwiftFormat via Mint
      run: |
        mint install nicklockwood/SwiftFormat
        
    - name: Validate SwiftFormat
      run: |
        echo "🔍 Running SwiftFormat validation..."
        if mint run swiftformat . --lint; then
          echo "✅ SwiftFormat validation passed"
        else
          echo "❌ SwiftFormat validation failed!"
          echo "Please run 'mint run swiftformat .' locally to fix formatting issues."
          exit 1
        fi
        
    - name: Run SwiftLint (if configured)
      run: |
        if command -v swiftlint &> /dev/null; then
          swiftlint lint --reporter github-actions-logging
        else
          echo "SwiftLint not installed, skipping..."
        fi
        
    - name: Check for TODO comments
      run: |
        echo "Checking for TODO comments..."
        if grep -r "TODO" --include="*.swift" .; then
          echo "⚠️  TODO comments found in code"
        else
          echo "✅ No TODO comments found"
        fi
        
    - name: Check for FIXME comments
      run: |
        echo "Checking for FIXME comments..."
        if grep -r "FIXME" --include="*.swift" .; then
          echo "⚠️  FIXME comments found in code"
        else
          echo "✅ No FIXME comments found"
        fi

  test:
    name: Run Tests
    runs-on: macos-latest
    needs: code-quality
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.3'
        
    - name: Install XcodeGen
      run: |
        brew install xcodegen
        
    - name: Generate Xcode project
      run: |
        make generate
        
    - name: Run Tests
      run: |
        make test
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult.zip

  build:
    name: Build App
    runs-on: macos-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.3'
        
    - name: Install XcodeGen
      run: |
        brew install xcodegen
        
    - name: Generate Xcode project
      run: |
        make generate
        
    - name: Build App
      run: |
        make build
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GitHubAppDev-Release
        path: ./build/ 