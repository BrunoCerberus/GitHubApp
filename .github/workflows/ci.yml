name: CI Pipeline

on:
  pull_request:
    branches: [ develop, master, main ]

jobs:
  code-quality:
    name: Code Quality
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0.1'

    - name: Cache Homebrew packages
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/Homebrew
          /usr/local/Homebrew
        key: ${{ runner.os }}-brew-v1
        restore-keys: |
          ${{ runner.os }}-brew-

    - name: Cache Mint packages
      uses: actions/cache@v4
      with:
        path: ~/.mint
        key: ${{ runner.os }}-mint-v1
        restore-keys: |
          ${{ runner.os }}-mint-

    - name: Install XcodeGen
      run: |
        brew install xcodegen

    - name: Generate Xcode project
      run: |
        make generate

    - name: Install Mint
      run: |
        brew install mint

    - name: Install SwiftFormat via Mint
      run: |
        mint install nicklockwood/SwiftFormat

    - name: Validate SwiftFormat
      run: |
        echo "🔍 Running SwiftFormat validation..."
        if mint run swiftformat . --lint; then
          echo "✅ SwiftFormat validation passed"
        else
          echo "❌ SwiftFormat validation failed!"
          echo "Please run 'mint run swiftformat .' locally to fix formatting issues."
          exit 1
        fi

    - name: Run SwiftLint (if configured)
      run: |
        if command -v swiftlint &> /dev/null; then
          swiftlint lint --reporter github-actions-logging
        else
          echo "SwiftLint not installed, skipping..."
        fi

    - name: Check for TODO comments
      run: |
        echo "Checking for TODO comments..."
        if grep -r "TODO" --include="*.swift" .; then
          echo "⚠️  TODO comments found in code"
        else
          echo "✅ No TODO comments found"
        fi

    - name: Check for FIXME comments
      run: |
        echo "Checking for FIXME comments..."
        if grep -r "FIXME" --include="*.swift" .; then
          echo "⚠️  FIXME comments found in code"
        else
          echo "✅ No FIXME comments found"
        fi

  build:
    name: Build Project
    runs-on: macos-latest
    needs: code-quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0.1'

    - name: Cache Homebrew packages
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/Homebrew
          /usr/local/Homebrew
        key: ${{ runner.os }}-brew-v1
        restore-keys: |
          ${{ runner.os }}-brew-

    - name: Cache SPM dependencies
      uses: actions/cache@v4
      with:
        path: |
          GitHubApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}-${{ hashFiles('project.yml') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Install XcodeGen
      run: |
        brew install xcodegen

    - name: Generate Xcode project
      run: |
        make generate

    - name: Debug Package Dependencies
      run: |
        echo "🔍 Checking package dependencies..."
        if [ -d "GitHubApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/" ]; then
          ls -la GitHubApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/
          echo "📦 Package.resolved content:"
          cat GitHubApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved || echo "Package.resolved not found"
        else
          echo "⚠️  Swift PM directory not found (this is normal for a fresh project generation)"
        fi

    - name: Resolve Package Dependencies
      run: |
        echo "📦 Explicitly resolving Swift Package Manager dependencies..."
        xcodebuild -resolvePackageDependencies \
          -project GitHubApp.xcodeproj \
          -scheme GitHubAppDev \
          -onlyUsePackageVersionsFromResolvedFile
        echo "✅ Package dependencies resolved successfully"

    - name: Pre-boot simulator
      run: |
        echo "🚀 Pre-booting simulator..."
        xcrun simctl boot "iPhone Air" || echo "Simulator already booted or unavailable"

    - name: Build for testing (GitHubAppDev)
      run: |
        echo "🔨 Building GitHubAppDev scheme for testing..."
        xcodebuild build-for-testing \
          -project GitHubApp.xcodeproj \
          -scheme GitHubAppDev \
          -destination 'platform=iOS Simulator,name=iPhone Air' \
          -derivedDataPath ./DerivedData

    - name: Build for testing (GitHubAppSnapshotTests)
      run: |
        echo "🔨 Building GitHubAppSnapshotTests scheme for testing..."
        xcodebuild build-for-testing \
          -project GitHubApp.xcodeproj \
          -scheme GitHubAppSnapshotTests \
          -destination 'platform=iOS Simulator,name=iPhone Air' \
          -derivedDataPath ./DerivedData

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-products
        path: ./DerivedData
        retention-days: 1

  tests:
    name: ${{ matrix.test-name }}
    runs-on: macos-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - test-target: GitHubAppTests
            test-name: Unit Tests
            scheme: GitHubAppDev
            artifact-name: unit-test-results
          - test-target: GitHubAppUITests
            test-name: UI Tests
            scheme: GitHubAppDev
            artifact-name: ui-test-results
          - test-target: GitHubAppSnapshotTests
            test-name: Snapshot Tests
            scheme: GitHubAppSnapshotTests
            artifact-name: snapshot-test-results

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0.1'

    - name: Cache Homebrew packages
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/Homebrew
          /usr/local/Homebrew
        key: ${{ runner.os }}-brew-v1
        restore-keys: |
          ${{ runner.os }}-brew-

    - name: Cache SPM dependencies
      uses: actions/cache@v4
      with:
        path: |
          GitHubApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}-${{ hashFiles('project.yml') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Install XcodeGen
      run: |
        brew install xcodegen

    - name: Generate Xcode project
      run: |
        make generate

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-products
        path: ./DerivedData

    - name: Pre-boot simulator
      run: |
        echo "🚀 Pre-booting simulator..."
        xcrun simctl boot "iPhone Air" || echo "Simulator already booted or unavailable"

    - name: Run ${{ matrix.test-name }}
      timeout-minutes: 30
      run: |
        mkdir -p test-results
        xcodebuild test-without-building \
          -project GitHubApp.xcodeproj \
          -scheme ${{ matrix.scheme }} \
          -only-testing:${{ matrix.test-target }} \
          -destination 'platform=iOS Simulator,name=iPhone Air' \
          -derivedDataPath ./DerivedData \
          -resultBundlePath test-results/${{ matrix.artifact-name }}.xcresult \
          -disableAutomaticPackageResolution \
          | tee /tmp/test_output.log || true
        grep -E "(Test run.*passed|Test run.*failed)" /tmp/test_output.log | tail -5 || echo "${{ matrix.test-name }} completed"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ matrix.artifact-name }}
        path: test-results/${{ matrix.artifact-name }}.xcresult
        if-no-files-found: warn

  test-results:
    name: Test Results Summary
    runs-on: macos-latest
    needs: [tests]
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download unit test results
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: unit-test-results
        path: unit-test-results

    - name: Download UI test results
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: ui-test-results
        path: ui-test-results

    - name: Download snapshot test results
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: snapshot-test-results
        path: snapshot-test-results

    - name: Check test job results
      id: check-results
      run: |
        # Check the outcome of the tests job
        TEST_RESULT="${{ needs.tests.result }}"
        echo "Tests job result: $TEST_RESULT"

        if [ "$TEST_RESULT" == "success" ]; then
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "status=failure" >> $GITHUB_OUTPUT
        fi

    - name: Display Test Results Summary
      run: |
        echo "📊 Test Results Summary"
        echo "========================"
        echo ""

        # Check if artifacts exist and display status
        UNIT_STATUS="❓ Unknown"
        UI_STATUS="❓ Unknown"
        SNAPSHOT_STATUS="❓ Unknown"

        if [ -d "unit-test-results" ]; then
          UNIT_STATUS="✅ Completed"
        else
          UNIT_STATUS="❌ Failed or Missing"
        fi

        if [ -d "ui-test-results" ]; then
          UI_STATUS="✅ Completed"
        else
          UI_STATUS="❌ Failed or Missing"
        fi

        if [ -d "snapshot-test-results" ]; then
          SNAPSHOT_STATUS="✅ Completed"
        else
          SNAPSHOT_STATUS="❌ Failed or Missing"
        fi

        echo "Unit Tests: $UNIT_STATUS"
        echo "UI Tests: $UI_STATUS"
        echo "Snapshot Tests: $SNAPSHOT_STATUS"
        echo ""
        echo "📁 Test artifacts downloaded:"
        ls -la unit-test-results/ 2>/dev/null || echo "  ⚠️  No unit test artifacts found"
        ls -la ui-test-results/ 2>/dev/null || echo "  ⚠️  No UI test artifacts found"
        ls -la snapshot-test-results/ 2>/dev/null || echo "  ⚠️  No snapshot test artifacts found"
        echo ""

        if [ "${{ steps.check-results.outputs.status }}" == "success" ]; then
          echo "🎉 All tests completed successfully!"
        else
          echo "⚠️  Some tests failed or were cancelled"
        fi

    - name: Fail if tests failed
      if: steps.check-results.outputs.status == 'failure'
      run: |
        echo "::error::Test suite failed or was cancelled"
        exit 1 