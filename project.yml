name: GitHubApp
options:
  bundleIdPrefix: com.bruno
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0.1"
  groupSortPosition: top
  generateEmptyDirectories: true
  fileTypes:
    xcassets:
      buildPhase: resources
  createIntermediateGroups: true

packages:
  EntropyCore:
    url: https://github.com/BrunoCerberus/EntropyCore.git
    revision: a741510ee5b339764ffcbab7adfbcfbb858094a6
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    from: 1.16.0

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.bruno.GitHubApp
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: 1,2
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    SUPPORTS_MACCATALYST: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
  configs:
    Debug:
      type: debug
    Release:
      type: release
  groups:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      GCC_OPTIMIZATION_LEVEL: 0
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_STRICT_OBJC_MSGSEND: YES
      CLANG_ENABLE_MODULE_DEBUGGING: YES
      ONLY_ACTIVE_ARCH: YES
      GCC_PREPROCESSOR_DEFINITIONS: DEBUG=1
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      GCC_OPTIMIZATION_LEVEL: s
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_STRICT_OBJC_MSGSEND: YES
      CLANG_ENABLE_MODULE_DEBUGGING: NO
      ONLY_ACTIVE_ARCH: NO

targets:
  GitHubApp:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GitHubApp
        excludes:
          - "**/__Snapshots__/**"
          - "**/testView.*.png"
          - "**/movieDetailsView.*.png"
    settings:
      base:
        INFOPLIST_FILE: GitHubApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.bruno.GitHubApp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        CODE_SIGN_ENTITLEMENTS: GitHubApp/GitHubApp.entitlements
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
      configs:
        Debug: {}
        Release: {}
    info:
      path: GitHubApp/Info.plist
      properties:
        CFBundleDisplayName: GitHubApp
        CFBundleIdentifier: com.bruno.GitHubApp
        CFBundleName: GitHubApp
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).GitHubAppSceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: Combine.framework
      - package: EntropyCore
      - target: GitHubAppWidgetExtension
        embed: true
    preBuildScripts:
      - name: Generate Project
        script: |
          if command -v xcodegen &> /dev/null; then
            xcodegen generate
          else
            echo "XcodeGen not found. Please install it first: brew install xcodegen"
          fi
        inputFiles:
          - project.yml
        outputFiles:
          - GitHubApp.xcodeproj

  GitHubAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GitHubAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bruno.GitHubAppTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GitHubApp.app/GitHubApp"
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: GitHubApp
      - sdk: XCTest.framework
      - package: SnapshotTesting
    info:
      path: GitHubAppTests/Info.plist
      properties:
        CFBundleName: GitHubAppTests
        CFBundleIdentifier: com.bruno.GitHubAppTests
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"

  GitHubAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GitHubAppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bruno.GitHubAppUITests
        TEST_TARGET_NAME: GitHubApp
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: GitHubApp
      - sdk: XCTest.framework
    info:
      path: GitHubAppUITests/Info.plist
      properties:
        CFBundleName: GitHubAppUITests
        CFBundleIdentifier: com.bruno.GitHubAppUITests
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"

  GitHubAppSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GitHubAppSnapshotTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bruno.GitHubAppSnapshotTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GitHubApp.app/GitHubApp"
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: GitHubApp
      - sdk: XCTest.framework
      - package: SnapshotTesting
    info:
      path: GitHubAppSnapshotTests/Info.plist
      properties:
        CFBundleName: GitHubAppSnapshotTests
        CFBundleIdentifier: com.bruno.GitHubAppSnapshotTests
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"

  GitHubAppWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bruno.GitHubApp.widget
        PRODUCT_NAME: GitHubAppWidgetExtension
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SKIP_INSTALL: YES
        SWIFT_VERSION: 5.0
        INFOPLIST_FILE: GitHubAppWidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: GitHubAppWidgetExtension/GitHubAppWidgetExtension.entitlements
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    sources:
      - path: GitHubAppWidgetExtension
      - path: GitHubApp/Configs/Localizable.swift
    dependencies:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: GitHubAppWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: "Upcoming Movies Widget"
        CFBundleName: GitHubAppWidgetExtension
        CFBundleIdentifier: com.bruno.GitHubApp.widget
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: false

schemes:
  GitHubAppDev:
    build:
      targets:
        GitHubApp: all
        GitHubAppWidgetExtension: all
      buildSettings:
        COMPILER_INDEX_STORE_ENABLE: NO
        ENABLE_BITCODE: NO
        CLANG_ENABLE_MODULE_DEBUGGING: NO
        SWIFT_COMPILATION_MODE: singlefile
        SWIFT_OPTIMIZATION_LEVEL: -Onone
        DWARFDUMP_USE_BINARY_PLIST: YES
        DEBUG_INFORMATION_FORMAT: dwarf
        ONLY_ACTIVE_ARCH: YES
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: NO
        GCC_OPTIMIZATION_LEVEL: 0
        ENABLE_TESTABILITY: YES
        COPY_PHASE_STRIP: NO
        VALIDATE_PRODUCT: NO
        CLANG_INDEX_STORE_PATH: "$(OBJROOT)/IndexStore"
        INDEX_ENABLE_DATA_STORE: NO
    run:
      config: Debug
      environmentVariables: {}
    test:
      config: Debug
      targets:
        - GitHubAppTests
        - GitHubAppUITests
      environmentVariables: {}
    profile:
      config: Release
      environmentVariables: {}
    analyze:
      config: Debug
      environmentVariables: {}
    archive:
      config: Release
      environmentVariables: {}

  GitHubAppProd:
    build:
      targets:
        GitHubApp: all
        GitHubAppWidgetExtension: all
    run:
      config: Release
      environmentVariables: {}
    test:
      config: Release
      targets:
        - GitHubAppTests
        - GitHubAppUITests
      environmentVariables: {}
    profile:
      config: Release
      environmentVariables: {}
    analyze:
      config: Release
      environmentVariables: {}
    archive:
      config: Release
      environmentVariables: {}

  GitHubAppTests:
    build:
      targets:
        GitHubAppTests: all
    test:
      config: Debug
      targets:
        - GitHubAppTests
      environmentVariables: {}

  GitHubAppUITests:
    build:
      targets:
        GitHubAppUITests: all
    test:
      config: Debug
      targets:
        - GitHubAppUITests
      environmentVariables: {}

  GitHubAppSnapshotTests:
    build:
      targets:
        GitHubAppSnapshotTests: all
    test:
      config: Debug
      targets:
        - GitHubAppSnapshotTests
      environmentVariables: {}
